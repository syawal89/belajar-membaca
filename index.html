<!DOCTYPE html>
<html lang="id">
<head>

  <style>
    * { box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    body { background-color:#121214;color:#FFF;height:100vh;height:100dvh;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding:12px 16px 10px;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden;gap:10px; }

    .word-display{font-size:4.4rem;font-weight:900;letter-spacing:5px;display:flex;justify-content:center;align-items:center;gap:4px;min-height:70px}.char{transition:transform .1s ease,text-shadow .1s ease;display:inline-block}.color-1{color:#38BDF8}.color-2{color:#FACC15}.color-3{color:#4ADE80}
    .blank-slot{display:inline-block;min-width:44px;border-bottom:5px solid #F43F5E;color:#F43F5E;animation:pulseSlot 1.2s infinite ease-in-out}@keyframes pulseSlot{0%,100%{opacity:.5}50%{opacity:1}}.highlight{transform:scale(1.24);color:#FFF!important;text-shadow:0 0 25px rgba(255,255,255,.95)}
    .controls-container{width:100%;max-width:420px;display:flex;flex-direction:column;gap:8px;flex-shrink:0;}.controls-learn{display:flex;flex-direction:column;gap:8px;width:100%}.controls-row{width:100%;display:flex;gap:10px}
    button.main-btn{flex:1;padding:14px 0;font-size:1.1rem;font-weight:800;border:none;border-radius:15px;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:6px;transition:transform .1s ease,opacity .2s ease}button.main-btn:active{transform:scale(.96)}button.main-btn:disabled{opacity:.55;cursor:not-allowed}.btn-speak{background-color:#22C55E;color:#052E16}.btn-next{background-color:#6366F1;color:#FFF}
    .btn-autoplay{width:100%;padding:12px 0;font-size:1rem;font-weight:800;border:2px solid #EC4899;background-color:#27272A;color:#F472B6;border-radius:14px;cursor:pointer;transition:all .2s ease}.btn-autoplay.active{background-color:#EC4899;color:#FFF;box-shadow:0 0 20px rgba(236,72,153,.4)}
    .quiz-options{display:none;gap:10px;width:100%}.btn-choice{flex:1;height:64px;font-size:2.1rem;font-weight:900;background-color:#27272A;color:#38BDF8;border:2px solid #3F3F46;border-radius:16px;cursor:pointer;box-shadow:0 5px 0 #18181B;transition:transform .1s ease,background-color .2s ease}.btn-choice:active{transform:translateY(3px);box-shadow:0 2px 0 #18181B}.btn-choice.wrong{background-color:#451A1A;border-color:#EF4444;color:#F87171;animation:shake .35s ease}@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}.app-signature{width:100%;max-width:420px;text-align:center;font-size:.78rem;font-weight:600;letter-spacing:.8px;color:#71717A;flex-shrink:0;padding-top:2px}.app-signature span{color:#A1A1AA;font-weight:700}
    .settings-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:120;opacity:0;pointer-events:none;transition:opacity .25s ease;padding:16px}.settings-modal.active{opacity:1;pointer-events:auto}.settings-card{background:#1E1E24;border:1px solid #3F3F46;border-radius:24px;padding:20px 18px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;box-shadow:0 15px 40px rgba(0,0,0,.8);transform:scale(.9);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}.settings-modal.active .settings-card{transform:scale(1)}.settings-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2E2E38;padding-bottom:8px}.settings-title{font-size:1.15rem;font-weight:800;color:#38BDF8}

    .celebration-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:150;opacity:0;pointer-events:none;transition:opacity .3s ease}.celebration-modal.active{opacity:1;pointer-events:auto}.celebration-card{background:#1E1E24;border:2px solid #FACC15;border-radius:28px;padding:28px 20px;text-align:center;max-width:320px;width:90%;transform:scale(.7);transition:transform .3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 10px 40px rgba(250,204,21,.3)}.celebration-modal.active .celebration-card{transform:scale(1)}.celebration-icon{font-size:3.6rem;margin-bottom:8px}.celebration-title{font-size:1.6rem;font-weight:900;color:#FACC15;margin-bottom:6px}.celebration-desc{font-size:1rem;color:#E4E4E7;margin-bottom:20px;font-weight:600}.btn-continue{width:100%;padding:13px;border-radius:14px;background:#22C55E;color:#052E16;font-size:1.05rem;font-weight:800;border:none;cursor:pointer}
  </style>
</head>

<div class="top-bar"><div class="star-badge-top"><span>&#9733;</span><span id="starCount">0</span></div><button class="btn-settings-open" id="btnOpenSettings">Pengaturan &#9881;</button></div>
<div class="word-card"><div class="icon-box" id="iconBox"><span class="mystery-mark">?</span><img id="wordImage" src="" alt="Ilustrasi" onerror="fallbackGambar()"></div><div id="wordDisplay" class="word-display"></div></div>

<div class="app-signature">Dibuat dengan &#9829; oleh <span>PaSya</span></div><div class="settings-modal" id="settingsModal"><div class="settings-card"><div class="settings-header"><span class="settings-title">Pengaturan Belajar</span></div><div class="mode-switch-container"><button class="btn-mode active" id="modeLearn">Mode Belajar</button><button class="btn-mode" id="modeQuiz">Mode Kuis Tebak</button></div><div class="settings-row"><div class="setting-group"><label for="letterLength">Jumlah Huruf:</label><select id="letterLength"><option value="3">3 Huruf</option><option value="4" selected>4 Huruf</option><option value="5">5 Huruf</option><option value="6">6 Huruf</option></select></div><div class="setting-group"><label for="speechSpeed">Kecepatan Eja:</label><select id="speechSpeed"><option value="slow">Lambat</option><option value="normal" selected>Sedang</option><option value="fast">Cepat</option></select></div></div><button class="btn-case-toggle" id="btnCaseToggle">[Aa] Huruf: BESAR (KAPITAL)</button><button class="btn-close-settings" id="btnCloseSettings">Selesai & Simpan</button></div></div>
<div class="celebration-modal" id="celebrationModal"><div class="celebration-card"><div class="celebration-icon">&#127942;</div><div class="celebration-title">LUAR BIASA!</div><div class="celebration-desc" id="celebrationText">Kamu berhasil mengumpulkan 5 Bintang!</div><button class="btn-continue" id="btnContinue">Lanjut Belajar</button></div></div>
<script>
const abjadId={'A':'a','B':'be','C':'ce','D':'de','E':'e','F':'ef','G':'ge','H':'ha','I':'i','J':'je','K':'ka','L':'el','M':'em','N':'en','O':'o','P':'pe','Q':'ki','R':'er','S':'es','T':'te','U':'u','V':'fe','W':'we','X':'eks','Y':'ye','Z':'zet'};
const twemojiBase="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/svg/";
const gambarWarna={"BUKU":twemojiBase+"1f4d6.svg","BOLA":twemojiBase+"26bd.svg","SAPI":twemojiBase+"1f404.svg","ROTI":twemojiBase+"1f35e.svg","TOPI":twemojiBase+"1f9e2.svg","MATA":twemojiBase+"1f441.svg","KUDA":twemojiBase+"1f40e.svg","MEJA":twemojiBase+"1fa91.svg","SUSU":twemojiBase+"1f95b.svg","GIGI":twemojiBase+"1f9b7.svg","SAPU":twemojiBase+"1f9f9.svg","KAYU":twemojiBase+"1fab5.svg","BAJU":twemojiBase+"1f455.svg","BATU":twemojiBase+"1faa8.svg","PALU":twemojiBase+"1f528.svg","TALI":twemojiBase+"1f9f5.svg","DUKU":twemojiBase+"1f34b.svg","RUSA":twemojiBase+"1f98c.svg","CUMI":twemojiBase+"1f991.svg","KADO":twemojiBase+"1f381.svg","IBU":twemojiBase+"1f469.svg","API":twemojiBase+"1f525.svg","AIR":twemojiBase+"1f4a7.svg","TAS":twemojiBase+"1f392.svg","ROK":twemojiBase+"1f457.svg","BUS":twemojiBase+"1f68c.svg","CAT":twemojiBase+"1f3a8.svg","RUMAH":twemojiBase+"1f3e0.svg","POHON":twemojiBase+"1f333.svg","KAPAL":twemojiBase+"1f6a2.svg","GAJAH":twemojiBase+"1f418.svg","HUJAN":twemojiBase+"1f327.svg","GELAS":twemojiBase+"1f943.svg","PISAU":twemojiBase+"1f52a.svg","LAMPU":twemojiBase+"1f4a1.svg","KUCING":twemojiBase+"1f431.svg","BEBEK":twemojiBase+"1f986.svg","AYAM":twemojiBase+"1f414.svg","MAWAR":twemojiBase+"1f339.svg","PISANG":twemojiBase+"1f34c.svg","JERUK":twemojiBase+"1f34a.svg","SEPEDA":twemojiBase+"1f6b2.svg","SEPATU":twemojiBase+"1f45f.svg","KERETA":twemojiBase+"1f682.svg","CELANA":twemojiBase+"1f456.svg","KELAPA":twemojiBase+"1f965.svg","KAMERA":twemojiBase+"1f4f7.svg","LEMARI":twemojiBase+"1f5c4.svg","KEMEJA":twemojiBase+"1f454.svg","BONEKA":twemojiBase+"1f9f8.svg","PERAHU":twemojiBase+"1f6a3.svg","GURITA":twemojiBase+"1f419.svg","DEFAULT":twemojiBase+"2b50.svg"};
const bankKata={3:["IBU","API","AIR","TAS","ROK","BUS","CAT"],4:["BUKU","BOLA","SAPI","ROTI","TOPI","MATA","KUDA","MEJA","SUSU","GIGI","SAPU","KAYU","BAJU","BATU","PALU","TALI","DUKU","RUSA","CUMI","KADO"],5:["RUMAH","POHON","KAPAL","GAJAH","HUJAN","GELAS","PISAU","LAMPU","KUCING","BEBEK","AYAM","MAWAR","PISANG","JERUK"],6:["SEPEDA","SEPATU","KERETA","CELANA","KELAPA","KAMERA","LEMARI","KEMEJA","BONEKA","PERAHU","GURITA"]};
let kataSekarang="",isUpperCase=true,voices=[],isSpeaking=false,isAutoPlay=false,isQuizMode=false,jumlahBintang=0,kataSudahDinilai=false,missingIndex=-1,correctChar="",currentChoices=[];
const display=document.getElementById("wordDisplay"),selectLength=document.getElementById("letterLength"),selectSpeed=document.getElementById("speechSpeed"),btnCaseToggle=document.getElementById("btnCaseToggle"),btnNext=document.getElementById("btnNext"),btnSpeak=document.getElementById("btnSpeak"),btnAutoPlay=document.getElementById("btnAutoPlay"),iconBox=document.getElementById("iconBox"),wordImage=document.getElementById("wordImage"),starCount=document.getElementById("starCount"),celebrationModal=document.getElementById("celebrationModal"),celebrationText=document.getElementById("celebrationText"),btnContinue=document.getElementById("btnContinue"),settingsModal=document.getElementById("settingsModal"),btnOpenSettings=document.getElementById("btnOpenSettings"),btnCloseSettings=document.getElementById("btnCloseSettings"),modeLearn=document.getElementById("modeLearn"),modeQuiz=document.getElementById("modeQuiz"),learnControls=document.getElementById("learnControls"),quizControls=document.getElementById("quizControls");
function muatDaftarSuara(){if(typeof window.speechSynthesis!=="undefined"){voices=window.speechSynthesis.getVoices()}} if(typeof window.speechSynthesis!=="undefined"){window.speechSynthesis.onvoiceschanged=muatDaftarSuara;muatDaftarSuara()}
function fallbackGambar(){wordImage.src=twemojiBase+"2b50.svg"}
let sharedAudioCtx=null;
function getAudioContext(){if(!sharedAudioCtx){const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(AudioContextClass)sharedAudioCtx=new AudioContextClass()}if(sharedAudioCtx&&sharedAudioCtx.state==='suspended')sharedAudioCtx.resume();return sharedAudioCtx}
function putarNadaKemenangan(){try{const audioCtx=getAudioContext();if(!audioCtx)return;const now=audioCtx.currentTime;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type="sine";osc.frequency.setValueAtTime(587.33,now);osc.frequency.setValueAtTime(880,now+.1);gain.gain.setValueAtTime(.3,now);gain.gain.exponentialRampToValueAtTime(.01,now+.4);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+.4)}catch(e){}}
function putarNadaSalah(){try{const audioCtx=getAudioContext();if(!audioCtx)return;const now=audioCtx.currentTime;const osc1=audioCtx.createOscillator(),gain1=audioCtx.createGain();osc1.type="sawtooth";osc1.frequency.setValueAtTime(180,now);gain1.gain.setValueAtTime(.35,now);gain1.gain.linearRampToValueAtTime(.01,now+.18);osc1.connect(gain1);gain1.connect(audioCtx.destination);osc1.start(now);osc1.stop(now+.18);const osc2=audioCtx.createOscillator(),gain2=audioCtx.createGain();osc2.type="sawtooth";osc2.frequency.setValueAtTime(120,now+.20);gain2.gain.setValueAtTime(.4,now+.20);gain2.gain.linearRampToValueAtTime(.01,now+.45);osc2.connect(gain2);gain2.connect(audioCtx.destination);osc2.start(now+.20);osc2.stop(now+.45)}catch(e){}}
function renderKata(kata){if(!kata)return;kataSekarang=kata;kataSudahDinilai=false;const len=kata.length;let html="";for(let i=0;i<len;i++){let warna="color-1";if(len===3)warna=i===0?"color-1":"color-2";else if(len===4||len===5)warna=i<2?"color-1":"color-2";else if(len===6){if(i<2)warna="color-1";else if(i<4)warna="color-2";else warna="color-3"}if(isQuizMode&&i===missingIndex)html+=`<span class="char blank-slot" id="char-${i}">_</span>`;else{const c=isUpperCase?kata[i].toUpperCase():kata[i].toLowerCase();html+=`<span class="char ${warna}" id="char-${i}">${c}</span>`}}display.innerHTML=html;wordImage.src=gambarWarna[kata]||gambarWarna.DEFAULT;if(isQuizMode)iconBox.classList.add("revealed");else iconBox.classList.remove("revealed")}
function siapkanSoalKuis(kata){const k=kata.toUpperCase();missingIndex=Math.floor(Math.random()*k.length);correctChar=k[missingIndex];const a="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").filter(h=>h!==correctChar);a.sort(()=>Math.random()-.5);currentChoices=[correctChar,a[0],a[1]].sort(()=>Math.random()-.5);perbaruiTampilanTombolKuis()}
function perbaruiTampilanTombolKuis(){for(let i=0;i<3;i++){const b=document.getElementById(`choice${i}`),c=currentChoices[i];b.classList.remove("wrong");b.innerText=isUpperCase?c:c.toLowerCase();b.onclick=()=>verifikasiJawabanKuis(c,b)}}
async function verifikasiJawabanKuis(c,b){if(c===correctChar){const t=document.getElementById(`char-${missingIndex}`);if(t){t.classList.remove("blank-slot");t.innerText=isUpperCase?correctChar:correctChar.toLowerCase();t.classList.add("highlight")}putarNadaKemenangan();await bunyikanItem(kataSekarang,.9);await jeda(300);jumlahBintang++;starCount.innerText=jumlahBintang;if(jumlahBintang%5===0){celebrationText.innerText=`Luar Biasa! Kamu dapat ${jumlahBintang} Bintang!`;celebrationModal.classList.add("active")}else{await jeda(1000);gantiKata()}}else{b.classList.add("wrong");putarNadaSalah();if(jumlahBintang>0){jumlahBintang--;starCount.innerText=jumlahBintang}setTimeout(()=>b.classList.remove("wrong"),400)}}
function toggleCase(){isUpperCase=!isUpperCase;btnCaseToggle.innerText=isUpperCase?"[Aa] Huruf: BESAR (KAPITAL)":"[Aa] Huruf: kecil";renderKata(kataSekarang);if(isQuizMode)perbaruiTampilanTombolKuis()}
function gantiKata(){if(typeof window.speechSynthesis!=="undefined"){window.speechSynthesis.cancel()}lepasSorot();const lenVal=selectLength?selectLength.value:"4";const len=parseInt(lenVal,10)||4;const daftar=bankKata[len]||bankKata[4];let k;do{k=daftar[Math.floor(Math.random()*daftar.length)]}while(k===kataSekarang&&daftar.length>1);kataSekarang=k;if(isQuizMode){siapkanSoalKuis(k);renderKata(k)}else{missingIndex=-1;renderKata(k)}}
function setMode(q){isQuizMode=q;if(isAutoPlay)toggleAutoPlay();if(typeof window.speechSynthesis!=="undefined"){window.speechSynthesis.cancel()}if(q){modeQuiz.classList.add("active");modeLearn.classList.remove("active");learnControls.style.display="none";quizControls.style.display="flex"}else{modeLearn.classList.add("active");modeQuiz.classList.remove("active");learnControls.style.display="flex";quizControls.style.display="none"}gantiKata()}
function sorot(a){document.querySelectorAll(".char").forEach(e=>e.classList.remove("highlight"));a.forEach(i=>{const e=document.getElementById(`char-${i}`);if(e)e.classList.add("highlight")})} function lepasSorot(){document.querySelectorAll(".char").forEach(e=>e.classList.remove("highlight"))} function jeda(ms){return new Promise(r=>setTimeout(r,ms))}
function bunyikanItem(teks,rate){return new Promise(resolve=>{if(typeof window.speechSynthesis==="undefined")return resolve();const s=new SpeechSynthesisUtterance(teks);s.lang="id-ID";s.rate=rate;if(voices.length===0)voices=window.speechSynthesis.getVoices();const v=voices.find(v=>(v.lang.includes("id")||v.lang.includes("ID"))&&(v.name.includes("Google")||v.name.includes("Indonesian")))||voices.find(v=>v.lang.includes("id")||v.lang.includes("ID"));if(v)s.voice=v;s.onend=resolve;s.onerror=resolve;window.speechSynthesis.speak(s)})}
function siapkanLangkahEja(kata){const len=kata.length,h=kata.toUpperCase().split("");let l=[];if(len===3)l=[{teks:h[0],highlight:[0]},{teks:abjadId[h[1]]||h[1],highlight:[1]},{teks:abjadId[h[2]]||h[2],highlight:[2]},{teks:h[1]+h[2],highlight:[1,2]},{teks:kata,highlight:[0,1,2]}];else if(len===4)l=[{teks:abjadId[h[0]]||h[0],highlight:[0]},{teks:abjadId[h[1]]||h[1],highlight:[1]},{teks:h[0]+h[1],highlight:[0,1]},{teks:abjadId[h[2]]||h[2],highlight:[2]},{teks:abjadId[h[3]]||h[3],highlight:[3]},{teks:h[2]+h[3],highlight:[2,3]},{teks:kata,highlight:[0,1,2,3]}];else if(len===5)l=[{teks:abjadId[h[0]]||h[0],highlight:[0]},{teks:abjadId[h[1]]||h[1],highlight:[1]},{teks:h[0]+h[1],highlight:[0,1]},{teks:abjadId[h[2]]||h[2],highlight:[2]},{teks:abjadId[h[3]]||h[3],highlight:[3]},{teks:h[2]+h[3],highlight:[2,3]},{teks:abjadId[h[4]]||h[4],highlight:[4]},{teks:h[2]+h[3]+h[4],highlight:[2,3,4]},{teks:kata,highlight:[0,1,2,3,4]}];else if(len===6)l=[{teks:abjadId[h[0]]||h[0],highlight:[0]},{teks:abjadId[h[1]]||h[1],highlight:[1]},{teks:h[0]+h[1],highlight:[0,1]},{teks:abjadId[h[2]]||h[2],highlight:[2]},{teks:abjadId[h[3]]||h[3],highlight:[3]},{teks:h[2]+h[3],highlight:[2,3]},{teks:abjadId[h[4]]||h[4],highlight:[4]},{teks:abjadId[h[5]]||h[5],highlight:[5]},{teks:h[4]+h[5],highlight:[4,5]},{teks:kata,highlight:[0,1,2,3,4,5]}];return l}
async function prosesEjaSatuKata(){const mode=selectSpeed.value;let rate=.85,jedaAntar=200;if(mode==="slow"){rate=.65;jedaAntar=350}else if(mode==="fast"){rate=1.25;jedaAntar=100}const l=siapkanLangkahEja(kataSekarang);for(let i=0;i<l.length;i++){if(!isSpeaking)break;sorot(l[i].highlight);await bunyikanItem(l[i].teks,rate);await jeda(jedaAntar)}await jeda(200);lepasSorot();if(isSpeaking){iconBox.classList.add("revealed");putarNadaKemenangan();if(!kataSudahDinilai){jumlahBintang++;starCount.innerText=jumlahBintang;kataSudahDinilai=true;if(jumlahBintang%5===0){await jeda(400);celebrationText.innerText=`Kamu berhasil mengumpulkan ${jumlahBintang} Bintang!`;celebrationModal.classList.add("active");return "MODAL_OPEN"}}}return "SUCCESS"}
async function mulaiEjaManual(){if(isSpeaking)return;isSpeaking=true;btnSpeak.disabled=true;btnNext.disabled=true;btnOpenSettings.disabled=true;if(typeof window.speechSynthesis!=="undefined"){window.speechSynthesis.cancel()}await prosesEjaSatuKata();isSpeaking=false;btnSpeak.disabled=false;btnNext.disabled=false;btnOpenSettings.disabled=false}
async function toggleAutoPlay(){if(isAutoPlay){isAutoPlay=false;isSpeaking=false;if(typeof window.speechSynthesis!=="undefined"){window.speechSynthesis.cancel()}lepasSorot();btnAutoPlay.classList.remove("active");btnAutoPlay.innerText="Putar Otomatis";btnSpeak.disabled=false;btnNext.disabled=false;btnOpenSettings.disabled=false}else{isAutoPlay=true;btnAutoPlay.classList.add("active");btnAutoPlay.innerText="Hentikan Otomatis";btnSpeak.disabled=true;btnNext.disabled=true;btnOpenSettings.disabled=true;while(isAutoPlay){isSpeaking=true;const hasil=await prosesEjaSatuKata();if(!isAutoPlay)break;if(hasil==="MODAL_OPEN")break;await jeda(2500);if(!isAutoPlay)break;gantiKata();await jeda(500)}}}
btnOpenSettings.addEventListener("click",()=>settingsModal.classList.add("active"));btnCloseSettings.addEventListener("click",()=>settingsModal.classList.remove("active"));btnContinue.addEventListener("click",()=>{celebrationModal.classList.remove("active");gantiKata();if(isAutoPlay)toggleAutoPlay()});btnNext.addEventListener("click",()=>{if(isAutoPlay)toggleAutoPlay();gantiKata()});btnSpeak.addEventListener("click",mulaiEjaManual);btnAutoPlay.addEventListener("click",toggleAutoPlay);btnCaseToggle.addEventListener("click",toggleCase);modeLearn.addEventListener("click",()=>setMode(false));modeQuiz.addEventListener("click",()=>setMode(true));selectLength.addEventListener("change",()=>{if(isAutoPlay)toggleAutoPlay();gantiKata()});window.addEventListener("DOMContentLoaded",()=>{gantiKata()});
</script></body></html>
